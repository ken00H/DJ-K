<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DJ-K</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#0e0e12; --panel:#17171d; --accent:#c26bff; --accent2:#38d0ff; --dim:#8a8a95; --line:#26262e; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:#eee; font:16px/1.5 system-ui,sans-serif;
         display:flex; flex-direction:column; height:100vh; }
  header { padding:10px 20px; background:var(--panel); display:flex;
           align-items:center; gap:12px; border-bottom:1px solid var(--line); }
  header h1 { font-size:1.1rem; }
  header .eq { display:flex; gap:3px; align-items:flex-end; height:18px; }
  header .eq span { width:4px; background:var(--accent); animation:bounce 1s infinite ease-in-out; }
  header .eq span:nth-child(2){ animation-delay:.2s } header .eq span:nth-child(3){ animation-delay:.4s }
  @keyframes bounce { 0%,100%{height:4px} 50%{height:18px} }
  #controls { margin-left:auto; display:flex; gap:8px; align-items:center; }
  button { background:#26262e; color:#eee; border:0; border-radius:8px;
           padding:8px 14px; cursor:pointer; font-size:.95rem; }
  button:hover { background:#33333d; }
  #vol { width:110px; accent-color:var(--accent); }
  #now { padding:8px 20px; background:var(--panel); border-bottom:1px solid var(--line);
         display:flex; align-items:center; gap:12px; min-height:42px; }
  #now .title { color:var(--accent2); font-size:.95rem; flex:1; overflow:hidden;
                text-overflow:ellipsis; white-space:nowrap; }
  #now .bpm { color:var(--accent); font-size:.8rem; border:1px solid var(--accent);
              border-radius:6px; padding:1px 8px; }
  #seek { flex:4; height:6px; appearance:none; background:#26262e; border-radius:3px; cursor:pointer; }
  #seek::-webkit-slider-thumb { appearance:none; width:14px; height:14px; border-radius:50%;
                                background:var(--accent2); }
  #time { color:var(--dim); font-size:.8rem; min-width:90px; text-align:right; }
  #main { flex:1; display:flex; min-height:0; }
  #chat { flex:1; overflow-y:auto; padding:20px; display:flex;
          flex-direction:column; gap:10px; }
  .msg { max-width:75%; padding:10px 14px; border-radius:14px; white-space:pre-wrap; }
  .you { align-self:flex-end; background:#2b2240; border-bottom-right-radius:4px; }
  .dj  { align-self:flex-start; background:var(--panel); border-bottom-left-radius:4px; }
  .dj b{ color:var(--accent); }
  .thinking { color:var(--dim); font-style:italic; }
  #side { width:300px; border-left:1px solid var(--line); display:flex;
          flex-direction:column; min-height:0; background:var(--panel); }
  #side h2 { font-size:.8rem; color:var(--dim); text-transform:uppercase;
             letter-spacing:.08em; padding:12px 16px 6px; }
  #queue { max-height:32%; overflow-y:auto; padding:0 8px 8px; }
  #queue .q { padding:6px 8px; border-radius:6px; font-size:.88rem; color:#cfcfda;
              overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #queue .q:nth-child(odd) { background:#1d1d25; }
  #libwrap { flex:1; display:flex; flex-direction:column; min-height:0; }
  #libsearch { margin:4px 12px 8px; background:var(--bg); border:1px solid var(--line);
               color:#eee; border-radius:8px; padding:8px 12px; font-size:.9rem; outline:none; }
  #libsearch:focus { border-color:var(--accent); }
  #lib { flex:1; overflow-y:auto; padding:0 8px 8px; }
  #lib .t { padding:6px 8px; border-radius:6px; font-size:.88rem; cursor:pointer;
            display:flex; gap:8px; align-items:center; }
  #lib .t:hover { background:#26262e; }
  #lib .t span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
  #lib .t .go { visibility:hidden; color:var(--accent2); }
  #lib .t:hover .go { visibility:visible; }
  form { display:flex; gap:10px; padding:14px 20px; background:var(--panel);
         border-top:1px solid var(--line); }
  input[type=text] { flex:1; background:var(--bg); border:1px solid var(--line); color:#eee;
        border-radius:10px; padding:12px 16px; font-size:1rem; outline:none; }
  form button { background:var(--accent); color:#111; font-weight:600; }
  @media (max-width:760px){ #side { display:none; } #seek { flex:2; } }
</style>
</head>
<body>
<header>
  <div class="eq"><span></span><span></span><span></span></div>
  <h1>DJ-K</h1>
  <div id="controls">
    <input type="range" id="vol" min="0" max="100" value="100" title="volume">
    <button data-cmd="skip">⏭ skip</button>
    <button data-cmd="pause">⏸ pause</button>
    <button data-cmd="stop">⏹ stop</button>
  </div>
</header>
<div id="now">
  <span class="bpm" id="bpm" hidden></span>
  <span class="title" id="title">♪ —</span>
  <input type="range" id="seek" min="0" max="100" value="0" title="seek">
  <span id="time">0:00 / 0:00</span>
</div>
<div id="main">
  <div id="chat"></div>
  <div id="side">
    <h2>Queue</h2>
    <div id="queue"></div>
    <div id="libwrap">
      <h2>Library</h2>
      <input type="text" id="libsearch" placeholder="filter tracks…">
      <div id="lib"></div>
    </div>
  </div>
</div>
<form id="f"><input type="text" id="q" placeholder="talk to the DJ… e.g. gimme a gym playlist" autocomplete="off"><button>Send</button></form>
<script>
const $ = id => document.getElementById(id);
const chat = $('chat'), now = $('title'), bpmEl = $('bpm'), seek = $('seek'),
      timeEl = $('time'), volEl = $('vol'), queueEl = $('queue'), libEl = $('lib');
const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
const fmt = s => { s = Math.max(0, s|0); return `${(s/60)|0}:${String(s%60).padStart(2,'0')}`; };
const post = (path, body) => fetch(path, { method:'POST',
  headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });

const add = (cls, html) => { const d = document.createElement('div');
  d.className = 'msg ' + cls; d.innerHTML = html; chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight; return d; };

document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const q = $('q');
  const text = q.value.trim(); if (!text) return;
  q.value = '';
  add('you', esc(text));
  const t = add('dj thinking','DJ is thinking…');
  try {
    const d = await (await post('/api/chat', {text})).json();
    t.className = 'msg dj';
    t.innerHTML = '<b>DJ ▸</b> ' + esc(d.reply);
  } catch { t.innerHTML = '<b>DJ ▸</b> connection lost'; }
};

document.querySelectorAll('#controls button').forEach(b =>
  b.onclick = () => post('/api/cmd', {cmd: b.dataset.cmd}));

let lastVol = 100;
volEl.onchange = () => { lastVol = volEl.value; post('/api/cmd', {cmd:'volume', value:+volEl.value}); };
let seeking = false;
seek.onmousedown = () => seeking = true;
seek.onchange = () => { post('/api/cmd', {cmd:'seek', value:+seek.value}); seeking = false; };

// --- library ---
let LIB = [];
const renderLib = filter => {
  const f = (filter||'').toLowerCase().split(/\s+/).filter(Boolean);
  libEl.innerHTML = LIB
    .filter(t => f.every(w => t.name.toLowerCase().includes(w)))
    .slice(0, 300)
    .map((t,i) => `<div class="t" data-i="${LIB.indexOf(t)}">
        <span>${esc(t.name)}</span><span class="go" data-mode="play" data-i="${LIB.indexOf(t)}">▶</span>
        <span class="go" data-mode="queue" data-i="${LIB.indexOf(t)}">＋</span></div>`).join('');
};
libEl.onclick = e => {
  const go = e.target.closest('.go');
  const row = e.target.closest('.t');
  if (!row) return;
  const mode = go ? go.dataset.mode : 'queue';
  post('/api/track', {path: LIB[+row.dataset.i].path, mode});
};
$('libsearch').oninput = e => renderLib(e.target.value);
fetch('/api/library').then(r => r.json()).then(t => { LIB = t; renderLib(''); });
fetch('/api/history').then(r => r.json()).then(h => {
  for (const m of h || [])
    add(m.role === 'user' ? 'you' : 'dj',
        m.role === 'user' ? esc(m.content) : '<b>DJ ▸</b> ' + esc(m.content));
});

// --- state poll ---
const poll = async () => {
  try {
    const s = await (await fetch('/api/state')).json();
    now.textContent = s.playing ? '♪ ' + (s.current || '') :
      (s.queue.length ? `♪ next up: ${s.queue[0]}` : '♪ —');
    document.title = s.playing ? '▶ ' + (s.current||'DJ-K') : 'DJ-K';
    if (s.bpm) { bpmEl.hidden = false; bpmEl.textContent = s.bpm + ' BPM'; }
    else bpmEl.hidden = true;
    if (s.volume != null && s.volume !== lastVol) { volEl.value = lastVol = s.volume; }
    if (s.duration) {
      seek.max = s.duration;
      if (!seeking && s.pos != null) seek.value = s.pos;
      timeEl.textContent = `${fmt(s.pos)} / ${fmt(s.duration)}`;
    } else { timeEl.textContent = '— / —'; }
    queueEl.innerHTML = s.queue.length
      ? s.queue.map(t => `<div class="q">${esc(t)}</div>`).join('')
      : '<div class="q" style="color:var(--dim)">empty</div>';
  } catch {}
};
poll(); setInterval(poll, 1000);
</script>
</body>
</html>
