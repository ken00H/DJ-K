<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DJ-K</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Crect width='128' height='128' rx='28' fill='%2317171d'/%3E%3Cpath d='M32 78 V64 a32 32 0 0 1 64 0 V78' fill='none' stroke='%23c26bff' stroke-width='9' stroke-linecap='round'/%3E%3Crect x='22' y='72' width='20' height='30' rx='9' fill='%23c26bff'/%3E%3Crect x='86' y='72' width='20' height='30' rx='9' fill='%23c26bff'/%3E%3Crect x='56' y='96' width='4' height='12' rx='2' fill='%2338d0ff'/%3E%3Crect x='64' y='88' width='4' height='20' rx='2' fill='%2338d0ff'/%3E%3Crect x='72' y='96' width='4' height='12' rx='2' fill='%2338d0ff'/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#0e0e12; --panel:#17171d; --accent:#c26bff; --accent2:#38d0ff; --dim:#8a8a95; --line:#26262e; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:#eee; font:16px/1.5 system-ui,sans-serif;
         display:flex; flex-direction:column; height:100vh; }
  header { padding:10px 20px; background:var(--panel); display:flex;
           align-items:center; gap:12px; border-bottom:1px solid var(--line); }
  header h1 { font-size:1.1rem; }
  header .eq { display:flex; gap:3px; align-items:flex-end; height:18px; }
  header .eq span { width:4px; background:var(--accent); animation:bounce 1s infinite ease-in-out; }
  header .eq span:nth-child(2){ animation-delay:.2s } header .eq span:nth-child(3){ animation-delay:.4s }
  @keyframes bounce { 0%,100%{height:4px} 50%{height:18px} }
  #controls { margin-left:auto; display:flex; gap:8px; align-items:center; }
  #emblem { width:26px; height:26px; }
  #gear { padding:6px; line-height:0; }
  #gear svg { width:20px; height:20px; fill:#eee; }
  #gear:hover svg { fill:var(--accent); }
  button { background:#26262e; color:#eee; border:0; border-radius:8px;
           padding:8px 14px; cursor:pointer; font-size:.95rem; }
  button:hover { background:#33333d; }
  /* settings modal */
  #overlay { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none;
             align-items:center; justify-content:center; z-index:10; }
  #overlay.open { display:flex; }
  #settings { background:var(--panel); border:1px solid var(--line); border-radius:14px;
              width:min(520px, 92vw); max-height:86vh; overflow-y:auto; padding:20px 22px; }
  #settings h2 { font-size:1rem; margin-bottom:2px; }
  #settings h3 { font-size:.75rem; color:var(--dim); text-transform:uppercase;
                 letter-spacing:.08em; margin:16px 0 8px; }
  #settings .row { display:flex; align-items:center; justify-content:space-between;
                   gap:12px; margin:8px 0; }
  #settings .row label { font-size:.9rem; color:#cfcfda; }
  #settings input[type=text], #settings input[type=password], #settings select {
    background:var(--bg); border:1px solid var(--line); color:#eee; border-radius:8px;
    padding:7px 10px; font-size:.88rem; width:60%; outline:none; }
  #settings input:focus, #settings select:focus { border-color:var(--accent); }
  .switch { position:relative; width:44px; height:24px; flex:none; }
  .switch input { opacity:0; width:0; height:0; }
  .switch span { position:absolute; inset:0; background:#33333d; border-radius:12px;
                 transition:.15s; cursor:pointer; }
  .switch span::before { content:''; position:absolute; width:18px; height:18px;
                 border-radius:50%; background:#8a8a95; top:3px; left:3px; transition:.15s; }
  .switch input:checked + span { background:var(--accent); }
  .switch input:checked + span::before { transform:translateX(20px); background:#fff; }
  #settings .note { color:var(--dim); font-size:.75rem; margin-top:4px; }
  #settings .actions { display:flex; gap:10px; margin-top:18px; align-items:center; }
  #savemsg { font-size:.8rem; color:var(--accent2); flex:1; }
  #vol { width:110px; accent-color:var(--accent); }
  #now { padding:8px 20px; background:var(--panel); border-bottom:1px solid var(--line);
         display:flex; align-items:center; gap:12px; min-height:42px; }
  #now .title { color:var(--accent2); font-size:.95rem; flex:1; overflow:hidden;
                text-overflow:ellipsis; white-space:nowrap; }
  #now .bpm { color:var(--accent); font-size:.8rem; border:1px solid var(--accent);
              border-radius:6px; padding:1px 8px; }
  #seek { flex:4; height:6px; appearance:none; background:#26262e; border-radius:3px; cursor:pointer; }
  #seek::-webkit-slider-thumb { appearance:none; width:14px; height:14px; border-radius:50%;
                                background:var(--accent2); }
  #time { color:var(--dim); font-size:.8rem; min-width:90px; text-align:right; }
  #main { flex:1; display:flex; min-height:0; }
  #chat { flex:1; overflow-y:auto; padding:20px; display:flex;
          flex-direction:column; gap:10px; }
  .msg { max-width:75%; padding:10px 14px; border-radius:14px; white-space:pre-wrap; }
  .you { align-self:flex-end; background:#2b2240; border-bottom-right-radius:4px; }
  .dj  { align-self:flex-start; background:var(--panel); border-bottom-left-radius:4px; }
  .dj b{ color:var(--accent); }
  .thinking { color:var(--dim); font-style:italic; }
  #side { width:300px; border-left:1px solid var(--line); display:flex;
          flex-direction:column; min-height:0; background:var(--panel); }
  #side h2 { font-size:.8rem; color:var(--dim); text-transform:uppercase;
             letter-spacing:.08em; padding:12px 16px 6px; }
  #queue { max-height:32%; overflow-y:auto; padding:0 8px 8px; }
  #queue .q { padding:6px 8px; border-radius:6px; font-size:.88rem; color:#cfcfda;
              overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #queue .q:nth-child(odd) { background:#1d1d25; }
  #libwrap { flex:1; display:flex; flex-direction:column; min-height:0; }
  #libsearch { margin:4px 12px 8px; background:var(--bg); border:1px solid var(--line);
               color:#eee; border-radius:8px; padding:8px 12px; font-size:.9rem; outline:none; }
  #libsearch:focus { border-color:var(--accent); }
  #lib { flex:1; overflow-y:auto; padding:0 8px 8px; }
  #lib .t { padding:6px 8px; border-radius:6px; font-size:.88rem; cursor:pointer;
            display:flex; gap:8px; align-items:center; }
  #lib .t:hover { background:#26262e; }
  #lib .t span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
  #lib .t .go { visibility:hidden; color:var(--accent2); }
  #lib .t:hover .go { visibility:visible; }
  form { display:flex; gap:10px; padding:14px 20px; background:var(--panel);
         border-top:1px solid var(--line); }
  input[type=text] { flex:1; background:var(--bg); border:1px solid var(--line); color:#eee;
        border-radius:10px; padding:12px 16px; font-size:1rem; outline:none; }
  form button { background:var(--accent); color:#111; font-weight:600; }
  @media (max-width:760px){ #side { display:none; } #seek { flex:2; } }
</style>
</head>
<body>
<header>
  <div class="eq"><span></span><span></span><span></span></div>
  <svg id="emblem" viewBox="0 0 128 128" aria-hidden="true"><rect width="128" height="128" rx="28" fill="#17171d"/><path d="M32 78 V64 a32 32 0 0 1 64 0 V78" fill="none" stroke="#c26bff" stroke-width="9" stroke-linecap="round"/><rect x="22" y="72" width="20" height="30" rx="9" fill="#c26bff"/><rect x="86" y="72" width="20" height="30" rx="9" fill="#c26bff"/><rect x="56" y="96" width="4" height="12" rx="2" fill="#38d0ff"/><rect x="64" y="88" width="4" height="20" rx="2" fill="#38d0ff"/><rect x="72" y="96" width="4" height="12" rx="2" fill="#38d0ff"/></svg>
  <h1>DJ-K</h1>
  <div id="controls">
    <input type="range" id="vol" min="0" max="100" value="100" title="volume">
    <button data-cmd="skip">⏭ skip</button>
    <button data-cmd="pause">⏸ pause</button>
    <button data-cmd="stop">⏹ stop</button>
    <button id="gear" title="settings"><svg viewBox="0 0 24 24"><path d="M19.14 12.94a7.5 7.5 0 0 0 .06-.94 7.5 7.5 0 0 0-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.3 7.3 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.58.24-1.12.55-1.62.94l-2.39-.96a.5.5 0 0 0-.6.22L2.67 8.84a.5.5 0 0 0 .12.64l2.03 1.58a7.5 7.5 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.31.6.22l2.39-.96c.5.39 1.04.7 1.62.94l.36 2.54c.04.24.25.42.5.42h3.84c.25 0 .46-.18.5-.42l.36-2.54a7.3 7.3 0 0 0 1.62-.94l2.39.96c.21.09.47 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/></svg></button>
  </div>
</header>
<div id="now">
  <span class="bpm" id="bpm" hidden></span>
  <span class="title" id="title">♪ —</span>
  <input type="range" id="seek" min="0" max="100" value="0" title="seek">
  <span id="time">0:00 / 0:00</span>
</div>
<div id="main">
  <div id="chat"></div>
  <div id="side">
    <h2>Queue</h2>
    <div id="queue"></div>
    <div id="libwrap">
      <h2>Library</h2>
      <input type="text" id="libsearch" placeholder="filter tracks…">
      <div id="lib"></div>
    </div>
  </div>
</div>
<div id="overlay">
  <div id="settings">
    <h2>Settings</h2>
    <h3>Playback <small>(applies instantly)</small></h3>
    <div class="row"><label>Crossfade</label><label class="switch"><input type="checkbox" id="s_crossfade"><span></span></label></div>
    <div class="row"><label>DJ voice</label><label class="switch"><input type="checkbox" id="s_tts"><span></span></label></div>
    <div class="row"><label>Beatmatch</label><label class="switch"><input type="checkbox" id="s_beatmatch"><span></span></label></div>
    <div class="row"><label>AI track generation</label><label class="switch"><input type="checkbox" id="s_musicgen"><span></span></label></div>
    <h3>AI backend <small>(applies on restart)</small></h3>
    <div class="row"><label>Provider</label><select id="s_provider"><option>auto</option><option>llamacpp</option><option>ollama</option><option>openai</option></select></div>
    <div class="row"><label>llama.cpp URL</label><input type="text" id="s_llamacpp_url"></div>
    <div class="row"><label>Ollama URL</label><input type="text" id="s_ollama_url"></div>
    <div class="row"><label>Ollama model</label><input type="text" id="s_ollama_model"></div>
    <div class="row"><label>OpenAI key</label><input type="password" id="s_openai_api_key" placeholder="sk-…"></div>
    <div class="row"><label>OpenAI model</label><input type="text" id="s_openai_model"></div>
    <div class="row"><label>LLM timeout (s)</label><input type="text" id="s_llm_timeout"></div>
    <h3>Advanced <small>(applies on restart)</small></h3>
    <div class="row"><label>Music folder</label><input type="text" id="s_music_dir"></div>
    <div class="row"><label>TTS voice</label><input type="text" id="s_tts_voice"></div>
    <div class="note">Settings live in <code>~/.config/djjamal/settings.json</code> (0600 — it holds your API key). Env vars override.</div>
    <div class="actions">
      <button id="s_save" style="background:var(--accent);color:#111;font-weight:600">Save</button>
      <button id="s_close">Close</button>
      <span id="savemsg"></span>
    </div>
  </div>
</div>
<form id="f"><input type="text" id="q" placeholder="talk to the DJ… e.g. gimme a gym playlist" autocomplete="off"><button>Send</button></form>
<script>
const $ = id => document.getElementById(id);
const chat = $('chat'), now = $('title'), bpmEl = $('bpm'), seek = $('seek'),
      timeEl = $('time'), volEl = $('vol'), queueEl = $('queue'), libEl = $('lib');
const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
const fmt = s => { s = Math.max(0, s|0); return `${(s/60)|0}:${String(s%60).padStart(2,'0')}`; };
const post = (path, body) => fetch(path, { method:'POST',
  headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });

const add = (cls, html) => { const d = document.createElement('div');
  d.className = 'msg ' + cls; d.innerHTML = html; chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight; return d; };

document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const q = $('q');
  const text = q.value.trim(); if (!text) return;
  q.value = '';
  add('you', esc(text));
  const t = add('dj thinking','DJ is thinking…');
  try {
    const d = await (await post('/api/chat', {text})).json();
    t.className = 'msg dj';
    t.innerHTML = '<b>DJ ▸</b> ' + esc(d.reply);
  } catch { t.innerHTML = '<b>DJ ▸</b> connection lost'; }
};

document.querySelectorAll('#controls button').forEach(b =>
  b.onclick = () => post('/api/cmd', {cmd: b.dataset.cmd}));

let lastVol = 100;
volEl.onchange = () => { lastVol = volEl.value; post('/api/cmd', {cmd:'volume', value:+volEl.value}); };
let seeking = false;
seek.onmousedown = () => seeking = true;
seek.onchange = () => { post('/api/cmd', {cmd:'seek', value:+seek.value}); seeking = false; };

// --- library ---
let LIB = [];
const renderLib = filter => {
  const f = (filter||'').toLowerCase().split(/\s+/).filter(Boolean);
  libEl.innerHTML = LIB
    .filter(t => f.every(w => t.name.toLowerCase().includes(w)))
    .slice(0, 300)
    .map((t,i) => `<div class="t" data-i="${LIB.indexOf(t)}">
        <span>${esc(t.name)}</span><span class="go" data-mode="play" data-i="${LIB.indexOf(t)}">▶</span>
        <span class="go" data-mode="queue" data-i="${LIB.indexOf(t)}">＋</span></div>`).join('');
};
libEl.onclick = e => {
  const go = e.target.closest('.go');
  const row = e.target.closest('.t');
  if (!row) return;
  const mode = go ? go.dataset.mode : 'queue';
  post('/api/track', {path: LIB[+row.dataset.i].path, mode});
};
$('libsearch').oninput = e => renderLib(e.target.value);
fetch('/api/library').then(r => r.json()).then(t => { LIB = t; renderLib(''); });
fetch('/api/history').then(r => r.json()).then(h => {
  for (const m of h || [])
    add(m.role === 'user' ? 'you' : 'dj',
        m.role === 'user' ? esc(m.content) : '<b>DJ ▸</b> ' + esc(m.content));
});

// --- settings ---
const KEYS = ["crossfade","tts","beatmatch","musicgen","provider","llamacpp_url",
  "ollama_url","ollama_model","openai_model","openai_api_key","llm_timeout",
  "music_dir","tts_voice"];
const overlay = $('overlay');
const openSettings = async () => {
  const s = await (await fetch('/api/settings')).json();
  for (const k of KEYS) {
    const el = $('s_' + k); if (!el) continue;
    if (el.type === 'checkbox') el.checked = !!s[k];
    else el.value = s[k] ?? '';
  }
  $('savemsg').textContent = '';
  overlay.classList.add('open');
};
$('gear').onclick = openSettings;
if (location.hash === '#settings') openSettings();  // deep link / screenshot hook
$('s_close').onclick = () => overlay.classList.remove('open');
overlay.onclick = e => { if (e.target === overlay) overlay.classList.remove('open'); };
$('s_save').onclick = async () => {
  const body = {};
  for (const k of KEYS) {
    const el = $('s_' + k); if (!el) continue;
    body[k] = el.type === 'checkbox' ? el.checked : el.value;
  }
  const r = await (await post('/api/settings', body)).json();
  $('savemsg').textContent = r.ok
    ? (r.restart_needed.length ? `saved — restart to apply: ${r.restart_needed.join(', ')}` : 'saved — live now')
    : ('error: ' + r.error);
};

// --- state poll ---
const poll = async () => {
  try {
    const s = await (await fetch('/api/state')).json();
    now.textContent = s.playing ? '♪ ' + (s.current || '') :
      (s.queue.length ? `♪ next up: ${s.queue[0]}` : '♪ —');
    document.title = s.playing ? '▶ ' + (s.current||'DJ-K') : 'DJ-K';
    if (s.bpm) { bpmEl.hidden = false; bpmEl.textContent = s.bpm + ' BPM'; }
    else bpmEl.hidden = true;
    if (s.volume != null && s.volume !== lastVol) { volEl.value = lastVol = s.volume; }
    if (s.duration) {
      seek.max = s.duration;
      if (!seeking && s.pos != null) seek.value = s.pos;
      timeEl.textContent = `${fmt(s.pos)} / ${fmt(s.duration)}`;
    } else { timeEl.textContent = '— / —'; }
    queueEl.innerHTML = s.queue.length
      ? s.queue.map(t => `<div class="q">${esc(t)}</div>`).join('')
      : '<div class="q" style="color:var(--dim)">empty</div>';
  } catch {}
};
poll(); setInterval(poll, 1000);
</script>
</body>
</html>
