<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DJ Jamal</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#0e0e12; --panel:#17171d; --accent:#c26bff; --accent2:#38d0ff; --dim:#8a8a95; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:#eee; font:16px/1.5 system-ui,sans-serif;
         display:flex; flex-direction:column; height:100vh; }
  header { padding:14px 20px; background:var(--panel); display:flex;
           align-items:center; gap:12px; border-bottom:1px solid #26262e; }
  header h1 { font-size:1.1rem; }
  header .eq { display:flex; gap:3px; align-items:flex-end; height:18px; }
  header .eq span { width:4px; background:var(--accent); animation:bounce 1s infinite ease-in-out; }
  header .eq span:nth-child(2){ animation-delay:.2s } header .eq span:nth-child(3){ animation-delay:.4s }
  @keyframes bounce { 0%,100%{height:4px} 50%{height:18px} }
  #controls { margin-left:auto; display:flex; gap:8px; }
  button { background:#26262e; color:#eee; border:0; border-radius:8px;
           padding:8px 14px; cursor:pointer; font-size:.95rem; }
  button:hover { background:#33333d; }
  #now { padding:10px 20px; background:var(--panel); color:var(--accent2);
         font-size:.95rem; border-bottom:1px solid #26262e; min-height:40px; }
  #chat { flex:1; overflow-y:auto; padding:20px; display:flex;
          flex-direction:column; gap:10px; }
  .msg { max-width:75%; padding:10px 14px; border-radius:14px; white-space:pre-wrap; }
  .you { align-self:flex-end; background:#2b2240; border-bottom-right-radius:4px; }
  .dj  { align-self:flex-start; background:var(--panel); border-bottom-left-radius:4px; }
  .dj b{ color:var(--accent); }
  .thinking { color:var(--dim); font-style:italic; }
  form { display:flex; gap:10px; padding:16px 20px; background:var(--panel); }
  input { flex:1; background:#0e0e12; border:1px solid #33333d; color:#eee;
          border-radius:10px; padding:12px 16px; font-size:1rem; outline:none; }
  input:focus { border-color:var(--accent); }
  form button { background:var(--accent); color:#111; font-weight:600; }
</style>
</head>
<body>
<header>
  <div class="eq"><span></span><span></span><span></span></div>
  <h1>DJ Jamal</h1>
  <div id="controls">
    <button data-cmd="skip">⏭ skip</button>
    <button data-cmd="pause">⏸ pause</button>
    <button data-cmd="stop">⏹ stop</button>
  </div>
</header>
<div id="now">♪ —</div>
<div id="chat"></div>
<form id="f"><input id="q" placeholder="talk to the DJ… e.g. gimme a gym playlist" autocomplete="off"><button>Send</button></form>
<script>
const chat = document.getElementById('chat'), now = document.getElementById('now');
const add = (cls, html) => { const d = document.createElement('div');
  d.className = 'msg ' + cls; d.innerHTML = html; chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight; return d; };

document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const q = document.getElementById('q');
  const text = q.value.trim(); if (!text) return;
  q.value = '';
  add('you', text.replace(/</g,'&lt;'));
  const t = add('dj thinking','DJ is thinking…');
  try {
    const r = await fetch('/api/chat', { method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({text}) });
    const d = await r.json();
    t.className = 'msg dj';
    t.innerHTML = '<b>DJ ▸</b> ' + (d.reply||'').replace(/</g,'&lt;');
  } catch { t.innerHTML = '<b>DJ ▸</b> connection lost'; }
};

document.querySelectorAll('#controls button').forEach(b =>
  b.onclick = () => fetch('/api/cmd', { method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({cmd: b.dataset.cmd}) }));

const poll = async () => {
  try {
    const s = await (await fetch('/api/state')).json();
    now.textContent = s.playing ? '♪ ' + (s.current || '') :
      (s.queue.length ? `♪ next up: ${s.queue[0]}` : '♪ —');
    document.title = s.playing ? '▶ ' + (s.current||'DJ Jamal') : 'DJ Jamal';
  } catch {}
};
poll(); setInterval(poll, 2000);
</script>
</body>
</html>
