<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 128">
  <!-- DJ-K logo: emblem + wordmark, purple→cyan on dark panel -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c26bff"/>
      <stop offset="1" stop-color="#38d0ff"/>
    </linearGradient>
  </defs>
  <rect width="520" height="128" rx="28" fill="#17171d"/>
  <rect x="4" y="4" width="512" height="120" rx="24" fill="none" stroke="#26262e" stroke-width="2"/>
  <!-- emblem -->
  <g transform="translate(20,0)">
    <path d="M32 78 V64 a32 32 0 0 1 64 0 V78" fill="none" stroke="#c26bff" stroke-width="9" stroke-linecap="round"/>
    <rect x="22" y="72" width="20" height="30" rx="9" fill="#c26bff"/>
    <rect x="86" y="72" width="20" height="30" rx="9" fill="#c26bff"/>
    <rect x="56"  y="96" width="4" height="12" rx="2" fill="#38d0ff"/>
    <rect x="64"  y="88" width="4" height="20" rx="2" fill="#38d0ff"/>
    <rect x="72"  y="96" width="4" height="12" rx="2" fill="#38d0ff"/>
  </g>
  <!-- wordmark -->
  <text x="180" y="85" font-family="system-ui,'Segoe UI',Roboto,sans-serif" font-size="64"
        font-weight="800" letter-spacing="2" fill="url(#g)">DJ-K</text>
</svg>
