<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- DJ-K app icon: headphones over a waveform, on the project's dark panel -->
  <rect width="128" height="128" rx="28" fill="#17171d"/>
  <rect x="4" y="4" width="120" height="120" rx="24" fill="none" stroke="#26262e" stroke-width="2"/>
  <!-- headband -->
  <path d="M32 78 V64 a32 32 0 0 1 64 0 V78" fill="none" stroke="#c26bff" stroke-width="9" stroke-linecap="round"/>
  <!-- ear cups -->
  <rect x="22" y="72" width="20" height="30" rx="9" fill="#c26bff"/>
  <rect x="86" y="72" width="20" height="30" rx="9" fill="#c26bff"/>
  <!-- waveform bars -->
  <rect x="56"  y="96" width="4" height="12" rx="2" fill="#38d0ff"/>
  <rect x="64"  y="88" width="4" height="20" rx="2" fill="#38d0ff"/>
  <rect x="72"  y="96" width="4" height="12" rx="2" fill="#38d0ff"/>
