name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, python-version: "3.10" }
          - { os: ubuntu-latest, python-version: "3.12" }
          - { os: windows-latest, python-version: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m py_compile dj/main.py dj/web.py dj/player.py dj/library.py dj/llm.py dj/djbrain.py dj/mpvproc.py dj/tts.py dj/musicgen.py
      - name: Smoke tests (stdlib only, no mpv/audio needed)
        run: python -m unittest discover -s tests -v
      - name: Lint
        run: |
          pip install ruff
          ruff check dj/ tests/
